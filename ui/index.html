<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP IDE</title>
<link rel="stylesheet" href="style.css">
<!-- KaTeX (vendored) renders Codeforces-style $$$math$$$ in fetched statements.
     It must load before Monaco's AMD loader, otherwise its UMD wrapper registers as a module. -->
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<script src="katex/auto-render.min.js"></script>
</head>
<body>
<!-- Covers the blank frame while the AMD loader pulls Monaco in; app.js removes it. -->
<div id="splash">
  <div class="sp-inner">
    <img class="sp-logo sp-dark" src="assets/logo-white.png" alt="">
    <img class="sp-logo sp-light" src="assets/logo.png" alt="">
    <div class="sp-name">CP IDE</div>
    <div class="sp-bar"><span></span></div>
  </div>
</div>
<div id="app"></div>
<div id="editor-host"><div id="monaco"></div></div>
<script src="vs/loader.js"></script>
<script src="app.js"></script>
</body>
</html>
